services:
  postgres:
    image: postgres:17-alpine
    container_name: yukira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yukira}
      POSTGRES_USER: ${POSTGRES_USER:-yukira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yukira_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yukira-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yukira} -d ${POSTGRES_DB:-yukira}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yukira-network

  quant-engine:
    build:
      context: ./quant-engine
      dockerfile: Dockerfile
    container_name: yukira-quant-engine
    restart: unless-stopped
    ports:
      - "${QUANT_ENGINE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - yukira-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yukira-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      quant-engine:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-yukira}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-yukira}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-yukira_dev}
      QUANT_ENGINE_URL: http://quant-engine:8001
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://dev-zpiz2xr3hd7ukpi3.us.auth0.com/}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-https://api.yukira.app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      YUKIRA_STORAGE_PATH: /var/data/yukira
      YUKIRA_HOLDINGS_REFRESH_ENABLED: ${YUKIRA_HOLDINGS_REFRESH_ENABLED:-false}
      YUKIRA_AMFI_NAV_REFRESH_ENABLED: ${YUKIRA_AMFI_NAV_REFRESH_ENABLED:-false}
      YUKIRA_BENCHMARK_REFRESH_ENABLED: ${YUKIRA_BENCHMARK_REFRESH_ENABLED:-false}
      YUKIRA_FBIL_REFRESH_ENABLED: ${YUKIRA_FBIL_REFRESH_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - yukira-backend-storage:/var/data/yukira
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yukira-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: yukira-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      AUTH0_SECRET: ${AUTH0_SECRET:-development_secret_32_characters_minimum_len}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-http://localhost:3000}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL:-https://dev-zpiz2xr3hd7ukpi3.us.auth0.com}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-placeholder_client_id}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-placeholder_client_secret}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.yukira.app}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - yukira-network

volumes:
  yukira-postgres-data:
    name: yukira-postgres-data
  yukira-backend-storage:
    name: yukira-backend-storage

networks:
  yukira-network:
    name: yukira-network
    driver: bridge
