spring.application.name=yukira-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yukira}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yukira}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yukira_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

yukira.quant-engine.url=${QUANT_ENGINE_URL:http://localhost:8001}

management.endpoints.web.exposure.include=health,info

spring.jackson.serialization.fail-on-empty-beans=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-zpiz2xr3hd7ukpi3.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api.yukira.app
