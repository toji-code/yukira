spring.application.name=yukira-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yukira}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yukira}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yukira_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

yukira.quant-engine.url=${QUANT_ENGINE_URL:http://localhost:8001}

management.endpoints.web.exposure.include=health,info

spring.jackson.serialization.fail-on-empty-beans=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://dev-zpiz2xr3hd7ukpi3.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES:https://api.yukira.app}

yukira.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3200,http://127.0.0.1:3200}
yukira.storage.path=${YUKIRA_STORAGE_PATH:/var/data/yukira}

spring.servlet.multipart.max-file-size=${CAS_MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${CAS_MAX_REQUEST_SIZE:20MB}

# Monthly Holdings Refresh Scheduler Configuration (Defaults to 12th of each month, safely after SEBI 10th-of-month statutory window)
yukira.holdings.refresh.enabled=${YUKIRA_HOLDINGS_REFRESH_ENABLED:false}
yukira.holdings.refresh.cron=${YUKIRA_HOLDINGS_REFRESH_CRON:0 0 2 12 * ?}

# Official AMC Holdings Discovery Configuration
yukira.holdings.discovery.enabled=${YUKIRA_HOLDINGS_DISCOVERY_ENABLED:true}
yukira.holdings.discovery.hdfc-url=${YUKIRA_HOLDINGS_DISCOVERY_HDFC_URL:https://www.hdfcfund.com/statutory-disclosures/monthly-fortnightly-scheme-portfolio}
yukira.holdings.discovery.ppfas-url=${YUKIRA_HOLDINGS_DISCOVERY_PPFAS_URL:https://amc.ppfas.com/downloads/portfolio-disclosure/}

# Scheduled Daily Market-Data Ingestion Pipelines (Phase A2)
yukira.amfi.nav.refresh.enabled=${YUKIRA_AMFI_NAV_REFRESH_ENABLED:false}
yukira.amfi.nav.refresh.cron=${YUKIRA_AMFI_NAV_REFRESH_CRON:0 0 23 * * ?}
yukira.amfi.nav.refresh.max-retries=${YUKIRA_AMFI_NAV_REFRESH_MAX_RETRIES:3}
yukira.amfi.nav.refresh.retry-delay-ms=${YUKIRA_AMFI_NAV_REFRESH_RETRY_DELAY_MS:2000}

yukira.benchmark.refresh.enabled=${YUKIRA_BENCHMARK_REFRESH_ENABLED:false}
yukira.benchmark.refresh.cron=${YUKIRA_BENCHMARK_REFRESH_CRON:0 30 23 * * ?}

yukira.fbil.refresh.enabled=${YUKIRA_FBIL_REFRESH_ENABLED:false}
yukira.fbil.refresh.cron=${YUKIRA_FBIL_REFRESH_CRON:0 45 23 * * ?}

# Historical Horizon Expansion Configuration (Phase A3)
yukira.horizon.default-reference-date=${YUKIRA_HORIZON_DEFAULT_REFERENCE_DATE:2026-10-01}
yukira.horizon.3y.threshold=${YUKIRA_HORIZON_3Y_THRESHOLD:700}
yukira.horizon.5y.candidate-threshold=${YUKIRA_HORIZON_5Y_CANDIDATE_THRESHOLD:1200}
yukira.horizon.10y.candidate-threshold=${YUKIRA_HORIZON_10Y_CANDIDATE_THRESHOLD:2400}

# Razorpay Payment Gateway & Commercial Subscription Configuration (Phase C2)
yukira.razorpay.key-id=${RAZORPAY_KEY_ID:}
yukira.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
yukira.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
yukira.razorpay.mode=${RAZORPAY_MODE:test}

# Continuous Fund & Portfolio Monitoring Engine Scheduler (Task 13)
yukira.monitoring.evaluation.enabled=${YUKIRA_MONITORING_EVALUATION_ENABLED:true}
yukira.monitoring.evaluation.cron=${YUKIRA_MONITORING_EVALUATION_CRON:0 0 4 * * ?}
yukira.monitoring.evaluation.zone=Asia/Kolkata

