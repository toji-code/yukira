spring.application.name=yukira-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yukira}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yukira}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yukira_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

yukira.quant-engine.url=${QUANT_ENGINE_URL:http://localhost:8001}

management.endpoints.web.exposure.include=health,info

spring.jackson.serialization.fail-on-empty-beans=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-zpiz2xr3hd7ukpi3.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api.yukira.app

# Monthly Holdings Refresh Scheduler Configuration (Defaults to 12th of each month, safely after SEBI 10th-of-month statutory window)
yukira.holdings.refresh.enabled=${YUKIRA_HOLDINGS_REFRESH_ENABLED:false}
yukira.holdings.refresh.cron=${YUKIRA_HOLDINGS_REFRESH_CRON:0 0 2 12 * ?}

# Official AMC Holdings Discovery Configuration
yukira.holdings.discovery.enabled=${YUKIRA_HOLDINGS_DISCOVERY_ENABLED:true}
yukira.holdings.discovery.hdfc-url=${YUKIRA_HOLDINGS_DISCOVERY_HDFC_URL:https://www.hdfcfund.com/statutory-disclosures/monthly-fortnightly-scheme-portfolio}
yukira.holdings.discovery.ppfas-url=${YUKIRA_HOLDINGS_DISCOVERY_PPFAS_URL:https://amc.ppfas.com/downloads/portfolio-disclosure/}
